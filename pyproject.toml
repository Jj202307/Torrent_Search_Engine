[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "torrent-search-engine"
version = "0.1.0"
description = "Multi-source torrent search with parallel scrapers and filter engine"
requires-python = ">=3.10"
dependencies = [
    "httpx>=0.27.0",
    "beautifulsoup4>=4.12.0",
    "lxml>=5.0.0",
    "rich>=13.0.0",
    "python-dotenv>=1.0.0",
    "tenacity>=8.0.0",
]

[project.optional-dependencies]
cloudflare = ["curl-cffi>=0.6.0"]
playwright = ["playwright>=1.40.0"]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23", "pytest-httpx>=0.30"]

[project.scripts]
torrent-search = "torrent_search.cli:main"

[tool.setuptools.packages.find]
include = ["torrent_search*"]
